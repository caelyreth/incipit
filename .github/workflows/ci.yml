name: ci

on:
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "locales/*.json"
      - "assets/profile.icon/Assets/profile.svg"
      - "internal/text/wordseg/cjk_dictionary.bin"
      - "internal/ui/theme/fonts/**"
      - "internal/ui/components/icons/*.svg"
      - "internal/ui/components/stamp.kage"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fetch assets
        run: go tool fetch

      - name: build linux
        run: go build ./...

      - name: build darwin
        env:
          GOOS: darwin
        run: go build ./...

      - name: build windows
        env:
          GOOS: windows
        run: go build ./...

      - name: vet linux
        run: go vet ./...

      - name: vet darwin
        env:
          GOOS: darwin
        run: go vet ./...

      - name: vet windows
        env:
          GOOS: windows
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

      - name: test race
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 ./internal/app/storage ./internal/app/search ./internal/app/updater ./internal/app/fonts
          go test -race -count=1 -run 'Test.*Backup|Test.*Restore|Test.*Flush|Test.*Notice|Test.*Saving|Test.*Goroutine|Test.*Search|Test.*Index|Test.*Update|Test.*NewerSettings|Test.*Settings|Test.*Lost|Test.*Written|Test.*Font|Test.*Repaired' ./internal/ui/window
