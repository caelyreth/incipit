name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: release version (defaults to version in mygo.json)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: resolve version
        id: resolve
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              raw="$GITHUB_REF_NAME"
            else
              raw="$(jq -r '.version' mygo.json)"
            fi
          fi
          ver="${raw#v}"
          tag="v${ver}"
          pre="false"
          if [[ "$ver" == *-* ]]; then
            pre="true"
          fi
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: darwin/arm64,darwin/amd64
            artifact: dist-darwin
          - name: linux
            os: ubuntu-latest
            target: linux/amd64,linux/arm64
            artifact: dist-linux
          - name: windows
            os: windows-latest
            target: windows/amd64,windows/arm64
            artifact: dist-windows
    env:
      CGO_ENABLED: "0"
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fetch and generate assets
        shell: bash
        run: |
          go tool fetch
          go tool icon assets/profile.icon assets/icon.png

      - name: import macos signing and notary credentials
        id: macos_creds
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          kc="$RUNNER_TEMP/incipit-build.keychain-db"
          has_notary="false"
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "APPLE_CERTIFICATE_P12 not set; skipping keychain import"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          security default-keychain -d user -s "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"

          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            if printf '%s' "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$APPLE_API_KEY" > "$key_path"
            else
              printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key_path"
            fi
            chmod 600 "$key_path"
            notary_args=(--key "$key_path" --key-id "$APPLE_API_KEY_ID" --keychain "$kc")
            if [ -n "$APPLE_API_ISSUER" ]; then
              notary_args+=(--issuer "$APPLE_API_ISSUER")
            fi
            xcrun notarytool store-credentials "incipit-notarize" "${notary_args[@]}"
            rm -f "$key_path"
            has_notary="true"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials "incipit-notarize" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --keychain "$kc"
            has_notary="true"
          else
            echo "Notary credentials not set; notarization will be skipped"
          fi
          echo "notarize=$has_notary" >> "$GITHUB_OUTPUT"

      - name: build packages and updates
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ] && [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY secret is required for tagged releases"
            exit 1
          fi
          ver="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            if [ "${GITHUB_REF_TYPE:-}" != "tag" ] && ! awk -v ver="$ver" '
              /^#{2,3} / {
                line = $0; sub(/^#{2,3}[[:space:]]+/, "", line)
                split(line, a, /[[:space:]]+/)
                h = a[1]; gsub(/^\[|\].*$/, "", h); sub(/^v/, "", h)
                if (h == ver) { found = 1; exit }
              }
              END { exit !found }
            ' CHANGELOG.md; then
              printf '\n### %s\n\n- Manual test build.\n' "$ver" >> CHANGELOG.md
            fi
            # Pinned mygo (evil-mygo) parses "## <version>" headings; normalize ###/#### -> ##/### for build.
            if ! awk -v ver="$ver" '
              /^## / {
                line = $0; sub(/^##[[:space:]]+/, "", line)
                split(line, a, /[[:space:]]+/)
                h = a[1]; gsub(/^\[|\].*$/, "", h); sub(/^v/, "", h)
                if (h == ver) { found = 1; exit }
              }
              END { exit !found }
            ' CHANGELOG.md; then
              awk '/^###+ / { sub(/^###/, "##") } { print }' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
            fi
          fi
          args=(-platform "${{ matrix.target }}" -version "$ver")
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            args+=(-sign "$APPLE_SIGNING_IDENTITY")
            if [ "${{ steps.macos_creds.outputs.notarize }}" != "true" ]; then
              args+=(-skip-notarize)
            fi
          else
            args+=(-skip-notarize)
          fi
          go tool mygo build "${args[@]}"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            find dist -maxdepth 3 -type d -name '*.app' -exec rm -rf {} +
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  draft:
    name: create draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts

      - name: stage assets and merge checksums
        shell: bash
        run: go tool release prepare-draft -in artifacts -out stage

      - name: generate notes and create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          to="$GITHUB_SHA"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            to="$GITHUB_REF_NAME"
          fi
          if ! npx --yes changelogithub --no-emoji --to "$to" --output release-notes.md || [ ! -s release-notes.md ]; then
            echo "changelogithub failed or empty; falling back to github generated notes"
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" -q .body > release-notes.md || [ ! -s release-notes.md ]; then
              printf "Release %s\n" "$tag" > release-notes.md
            fi
          fi
          pre_flag=""
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            pre_flag="--prerelease"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft $pre_flag --title "$tag" --notes-file release-notes.md
            gh release upload "$tag" --clobber stage/*
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft $pre_flag --title "$tag" --notes-file release-notes.md stage/*
          fi
